name: Build Wheels + PyPI deploy

on:
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
          - os: macos-15
            arch: "arm64"
          - os: macos-15-intel
            arch: "x86_64"
          - os: windows-latest
            arch: "AMD64"

    steps:
    - uses: actions/checkout@v5

    - name: Build wheels (arch=${{ matrix.arch }})
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_ARCHS: "${{ matrix.arch }}"

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install MPI
        run: |
          sudo apt update
          sudo apt install libopenmpi-dev

      - name: Build SDist
        run: |
          pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test source distribution on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build-sdist]
    strategy:
      matrix:
        os:
          - ubuntu-latest
        fftw:
          - bundled
          - system
    steps:
      - uses: actions/checkout@v5

      - name: Install MPI
        run: |
          sudo apt update
          sudo apt install libopenmpi-dev

      - name: Install FFTW
        if: matrix.fftw == 'system'
        run: |
          sudo apt install libfftw3-dev libfftw3-mpi-dev

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist

      - name: Install from SDist
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz
          python -m pip install pytest pytest-mpi

      - name: Run test suite
        run:
          mpirun --oversubscribe -np 4 python -m pytest --only-mpi

  upload_pypi:
    needs: [build-sdist, build-wheels, test-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
